name: Build & Deploy to GKE

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: my-gcp-project
  REGION: asia-south1
  CLUSTER_NAME: my-gke-cluster
  CLUSTER_LOCATION: asia-south1
  REPOSITORY: my-docker-repo
  IMAGE_NAME: my-app

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # REQUIRED for Workload Identity Federation

    steps:
      # -----------------------------
      # Checkout code
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # Authenticate to GCP using WIF
      # -----------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@my-gcp-project.iam.gserviceaccount.com

      # -----------------------------
      # Setup gcloud
      # -----------------------------
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # -----------------------------
      # Configure Docker for Artifact Registry
      # -----------------------------
      - name: Configure Docker
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      # -----------------------------
      # Build & Push Docker Image
      # -----------------------------
      - name: Build and Push Image
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }}"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # -----------------------------
      # Get GKE credentials
      # -----------------------------
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}

      # -----------------------------
      # Deploy to GKE
      # -----------------------------
      - name: Deploy to GKE
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" k8s/deployment.yaml
          kubectl apply -f k8s/
