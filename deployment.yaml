apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME_PLACEHOLDER
spec:
  replicas: 2
  selector:
    matchLabels:
      app: DEPLOYMENT_NAME_PLACEHOLDER
  template:
    metadata:
      labels:
        app: DEPLOYMENT_NAME_PLACEHOLDER
    spec:
      containers:
        - name: DEPLOYMENT_NAME_PLACEHOLDER
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
